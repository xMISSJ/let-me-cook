<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Let Me Cook</title>
    <script>
      // Redirect unknown paths to the hash route used by GitHub Pages builds.
      (function redirectToIndex() {
        const basePath = "/let-me-cook/";
        const { pathname, search, hash } = window.location;
        const l = window.location;
        const origin = l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "");
        const routePath = pathname.startsWith(basePath)
          ? "/" + pathname.slice(basePath.length)
          : pathname;

        l.replace(origin + basePath + "#" + (routePath || "/") + search + hash);
      })();
    </script>
  </head>
  <body></body>
</html>
