<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Let Me Cook</title>
    <script>
      // Redirect unknown paths back to index.html for SPA routing on GitHub Pages.
      // Repo is served at /let-me-cook/, so keep 1 path segment.
      (function redirectToIndex() {
        const segmentCount = 1;
        const { pathname, search, hash } = window.location;
        const l = window.location;
        const newPath =
          l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (search ? "&" + search.slice(1).replace(/&/g, "~and~") : "") +
          hash;
        l.replace(newPath);
      })();
    </script>
  </head>
  <body></body>
</html>
